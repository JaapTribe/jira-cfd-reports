<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFD – Team 2 · Week 17</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f1f5f9; color: #1e293b; }
  .wrapper { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
  header { margin-bottom: 20px; }
  header h1 { font-size: 1.5rem; font-weight: 700; color: #0f172a; }
  header p { font-size: 0.875rem; color: #64748b; margin-top: 4px; }
  .cards { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 10px; padding: 14px 18px; flex: 1 1 120px; min-width: 100px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  .card .label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: #94a3b8; margin-bottom: 4px; }
  .card .value { font-size: 1.75rem; font-weight: 700; color: #0f172a; }
  .card.total .value { color: #0ea5e9; }
  .card.done .value { color: #34d399; }
  .card.test .value { color: #f59e0b; }
  .card.active .value { color: #60a5fa; }
  .card.seldev .value { color: #38bdf8; }
  .card.backlog .value { color: #94a3b8; }
  .card.wip .value { color: #a78bfa; }
  .chart-box { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.07); margin-bottom: 20px; }
  footer { font-size: 0.75rem; color: #94a3b8; text-align: center; }
  footer a { color: #0ea5e9; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <h1>📊 CFD – Team 2 &middot; Week 17</h1>
    <p>SK &middot; BW (board 669) &middot; Week van 20 april &middot; 69 issues &middot; Bijgewerkt: vrijdag 24 april 2026 17:00</p>
  </header>

  <div class="cards">
    <div class="card total"><div class="label">Totaal</div><div class="value">69</div></div>
    <div class="card backlog"><div class="label">Backlog</div><div class="value">8</div></div>
    <div class="card seldev"><div class="label">Sel. for Dev</div><div class="value">13</div></div>
    <div class="card active"><div class="label">Active</div><div class="value">3</div></div>
    <div class="card test"><div class="label">Test</div><div class="value">27</div></div>
    <div class="card done"><div class="label">Done</div><div class="value">14</div></div>
    <div class="card wip"><div class="label">WIP</div><div class="value">47</div></div>
  </div>

  <div class="chart-box">
    <canvas id="cfd" height="340"></canvas>
  </div>

  <footer>
    Automatisch bijgewerkt om 17:00 op werkdagen &middot;
    <a href="https://tribeagency.atlassian.net/jira/software/boards/669" target="_blank">Board 669 openen ↗</a>
  </footer>
</div>

<script>
const labels = ['ma 20 apr', 'di 21 apr', 'wo 22 apr', 'do 23 apr', 'vr 24 apr'];

const datasets = [
  { label: 'Done',             data: [14,14,14,14,14], backgroundColor: '#34d399', borderColor: '#34d399', fill: true, tension: 0.3, pointRadius: 6, order: 1 },
  { label: 'Test',             data: [14,17,22,26,27], backgroundColor: '#f59e0b', borderColor: '#f59e0b', fill: true, tension: 0.3, pointRadius: 6, order: 2 },
  { label: 'Pull Request',     data: [1, 3, 3, 5, 4],  backgroundColor: '#a78bfa', borderColor: '#a78bfa', fill: true, tension: 0.3, pointRadius: 6, order: 3 },
  { label: 'Active',           data: [4, 3, 3, 3, 3],  backgroundColor: '#60a5fa', borderColor: '#60a5fa', fill: true, tension: 0.3, pointRadius: 6, order: 4 },
  { label: 'Selected for Dev', data: [20,18,15,13,13], backgroundColor: '#38bdf8', borderColor: '#38bdf8', fill: true, tension: 0.3, pointRadius: 6, order: 5 },
  { label: 'Backlog',          data: [8, 6, 6, 8, 8],  backgroundColor: '#94a3b8', borderColor: '#94a3b8', fill: true, tension: 0.3, pointRadius: 6, order: 6 },
];

new Chart(document.getElementById('cfd'), {
  type: 'line',
  data: { labels, datasets },
  options: {
    responsive: true,
    plugins: {
      legend: { position: 'bottom', labels: { usePointStyle: true, padding: 14, font: { size: 12 } } },
      tooltip: { mode: 'index', intersect: false }
    },
    scales: {
      x: { grid: { color: '#f1f5f9' } },
      y: {
        stacked: true,
        beginAtZero: true,
        grid: { color: '#f1f5f9' },
        title: { display: true, text: 'Aantal issues', font: { size: 12 }, color: '#94a3b8' }
      }
    },
    interaction: { mode: 'nearest', axis: 'x', intersect: false }
  }
});
</script>
</body>
</html>

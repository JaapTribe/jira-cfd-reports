<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFD - Team 2 - Week 19</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
    line-height: 1.5;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  header h1 {
    margin: 0 0 6px;
    font-size: 26px;
    font-weight: 700;
    color: #0f172a;
  }
  header .subtitle {
    color: #475569;
    font-size: 14px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.05), 0 1px 2px rgba(15,23,42,0.03);
    border: 1px solid #e2e8f0;
  }
  .card .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #64748b;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .card .value {
    font-size: 28px;
    font-weight: 700;
    color: #0f172a;
  }
  .card.total .value { color: #0f172a; }
  .card.backlog .value { color: #64748b; }
  .card.sel .value { color: #0284c7; }
  .card.active .value { color: #2563eb; }
  .card.test .value { color: #d97706; }
  .card.done .value { color: #059669; }
  .chart-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.05), 0 1px 2px rgba(15,23,42,0.03);
    border: 1px solid #e2e8f0;
    margin-bottom: 16px;
  }
  .chart-wrap {
    position: relative;
    height: 420px;
  }
  footer {
    margin-top: 16px;
    text-align: center;
    color: #64748b;
    font-size: 13px;
  }
  footer a {
    color: #2563eb;
    text-decoration: none;
  }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📊 CFD – Team 2 · Week 19</h1>
    <div class="subtitle">SK · BW (board 669) · Week van 4 mei · 232 issues · Bijgewerkt: maandag 4 mei 17:00</div>
  </header>

  <div class="stats">
    <div class="card total"><div class="label">Totaal</div><div class="value">232</div></div>
    <div class="card backlog"><div class="label">Backlog</div><div class="value">195</div></div>
    <div class="card sel"><div class="label">Selected for Dev</div><div class="value">0</div></div>
    <div class="card active"><div class="label">Active</div><div class="value">2</div></div>
    <div class="card test"><div class="label">Test</div><div class="value">35</div></div>
    <div class="card done"><div class="label">Done</div><div class="value">0</div></div>
  </div>

  <div class="chart-card">
    <div class="chart-wrap">
      <canvas id="cfd"></canvas>
    </div>
  </div>

  <footer>
    Automatisch bijgewerkt om 17:00 op werkdagen ·
    <a href="https://tribeagency.atlassian.net/jira/software/boards/669" target="_blank" rel="noopener">Board 669 openen ↗</a>
  </footer>
</div>

<script>
const CFD_DATA = [
  { date: "2026-05-04", "Backlog": 195, "Selected for Dev": 0, "Active": 2, "Pull Request": 0, "Test": 35, "Done": 0 }
];

const LANES = [
  { key: "Backlog",          color: "#94a3b8" },
  { key: "Selected for Dev", color: "#38bdf8" },
  { key: "Active",           color: "#60a5fa" },
  { key: "Pull Request",     color: "#a78bfa" },
  { key: "Test",             color: "#f59e0b" },
  { key: "Done",             color: "#34d399" }
];

const labels = CFD_DATA.map(d => {
  const dt = new Date(d.date + "T00:00:00");
  const dnames = ["zo","ma","di","wo","do","vr","za"];
  return dnames[dt.getDay()] + " " + dt.getDate() + "/" + (dt.getMonth() + 1);
});

function hexToRgba(hex, alpha) {
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
}

const datasets = LANES.map(lane => ({
  label: lane.key,
  data: CFD_DATA.map(d => d[lane.key] || 0),
  borderColor: lane.color,
  backgroundColor: hexToRgba(lane.color, 0.55),
  fill: true,
  tension: 0.3,
  pointRadius: 6,
  pointBackgroundColor: lane.color,
  pointBorderColor: "#fff",
  pointBorderWidth: 2,
  borderWidth: 2
}));

const ctx = document.getElementById("cfd").getContext("2d");
new Chart(ctx, {
  type: "line",
  data: { labels: labels, datasets: datasets },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { intersect: false, mode: "index" },
    plugins: {
      legend: {
        position: "bottom",
        labels: { boxWidth: 14, boxHeight: 14, padding: 14, font: { size: 12 } }
      },
      tooltip: {
        callbacks: {
          footer: function(items) {
            let total = 0;
            items.forEach(i => total += i.parsed.y);
            return "Totaal: " + total;
          }
        }
      }
    },
    scales: {
      x: {
        stacked: true,
        grid: { display: false },
        ticks: { color: "#475569", font: { size: 12 } }
      },
      y: {
        stacked: true,
        beginAtZero: true,
        grid: { color: "#e2e8f0" },
        ticks: { color: "#475569", font: { size: 12 }, precision: 0 }
      }
    }
  }
});
</script>
</body>
</html>
